<header>
  <div class="container bar">
    <a routerLink="/" class="logo">🍳 המתכונים שלי</a>
    <nav>
      @if (auth.isAdmin()) {
        <a routerLink="/new" class="btn">+ מתכון חדש</a>

      } @else {
        <a routerLink="/login" class="link">כניסת מנהל</a>
      }
    </nav>
  </div>
</header>
<main class="container">
  <router-outlet />
</main>
