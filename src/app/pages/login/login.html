<div class="container">
  <form [formGroup]="form" (ngSubmit)="submit()" class="panel fade-in">
    <div class="icon">🔐</div>
    <h1>כניסת מנהל</h1>
    <p class="sub">הכניסה מיועדת למנהל האתר בלבד</p>
    <div class="field"><label>אימייל</label><input type="email" formControlName="email" dir="ltr" autocomplete="username" placeholder="name@example.com" /></div>
    <div class="field"><label>סיסמה</label><input type="password" formControlName="password" dir="ltr" autocomplete="current-password" /></div>
    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }
    <button class="btn" type="submit" [disabled]="busy()">{{ busy() ? 'מתחבר...' : 'כניסה' }}</button>
  </form>
</div>
