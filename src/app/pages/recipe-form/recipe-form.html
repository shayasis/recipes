<form [formGroup]="form" (ngSubmit)="submit()">
  <h1>מתכון חדש</h1>

  <div class="field"><label>שם המתכון *</label><input formControlName="title" /></div>
  <div class="field"><label>תיאור קצר</label><input formControlName="description" /></div>
  <div class="row">
    <div class="field"><label>קטגוריה *</label><input formControlName="category" placeholder="למשל: קינוחים" /></div>
    <div class="field"><label>זמן הכנה (דקות)</label><input type="number" formControlName="prepMinutes" /></div>
    <div class="field"><label>מנות</label><input type="number" formControlName="servings" /></div>
  </div>
  <div class="field"><label>קישור לתמונה</label><input formControlName="imageUrl" dir="ltr" placeholder="https://..." /></div>
  <div class="field"><label>מצרכים * (שורה לכל מצרך)</label><textarea rows="6" formControlName="ingredients"></textarea></div>
  <div class="field"><label>שלבי הכנה * (שורה לכל שלב)</label><textarea rows="6" formControlName="steps"></textarea></div>

  @if (form.invalid && form.touched) {
    <p class="error">יש למלא את כל שדות החובה (*)</p>
  }
  @if (saveError()) {
    <p class="error">{{ saveError() }}</p>
  }
  <button class="btn" type="submit" [disabled]="saving()">{{ saving() ? 'שומר...' : 'שמירת מתכון' }}</button>
</form>
